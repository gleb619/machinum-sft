# Remote GPU worker — docker compose deployment
#
# One service, one mount: the repo is bind-mounted at /workspace, so the container always
# runs the code you pushed. Nothing is installed on the host except Docker + the NVIDIA
# container toolkit. HF weights live outside the image in a host cache.

services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/remote/Dockerfile
    image: machinum-sft:cu128
    container_name: msft-worker
    restart: unless-stopped
    gpus: all
    shm_size: "8gb"
    working_dir: /workspace
    environment:
      HF_HOME: /hf
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      PYTHONUNBUFFERED: "1"
      MSFT_WORKER_DIR: /workspace/.worker
      WANDB_MODE: offline
    volumes:
      - ${MSFT_REPO:-../..}:/workspace
      - ${HF_CACHE:-~/.cache/huggingface}:/hf
    command: ["python", "-m", "msft", "worker", "serve", "--dir", "/workspace/.worker", "--interval", "15"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,pathlib; p=pathlib.Path('/workspace/.worker/heartbeat.json'); d=json.loads(p.read_text()); raise SystemExit(0 if time.time()-__import__('datetime').datetime.fromisoformat(d['updated']).timestamp()<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Profile `oneshot`: run one training job without the queue, useful for the first run
  # and for debugging. `docker compose --profile oneshot run --rm train-once`.
  train-once:
    profiles: ["oneshot"]
    image: machinum-sft:cu128
    build:
      context: ../..
      dockerfile: deploy/remote/Dockerfile
    gpus: all
    shm_size: "8gb"
    working_dir: /workspace
    environment:
      HF_HOME: /hf
      PYTHONUNBUFFERED: "1"
      WANDB_MODE: offline
    volumes:
      - ${MSFT_REPO:-../..}:/workspace
      - ${HF_CACHE:-~/.cache/huggingface}:/hf
    command:
      ["python", "-m", "msft", "train", "--config", "configs/gemma-4-12b-qlora.yaml", "--execute"]
