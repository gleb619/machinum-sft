# machinum:4b v2, tuned arm — the data arm plus the one hyperparameter change worth paying for.
#
# On a corpus this small the rank is not the bottleneck, so it drops to 16 with alpha at 2r, the
# learning rate doubles and the schedule gets three epochs (the data arm keeps 5e-5 / 3.0 for a clean
# comparison). Attention-only projections were considered and rejected: the failure being fixed is
# formatting, and the material notes warn that cutting the MLP projections costs the model its
# surface syntax rather than its voice. See `docs/score-improvement.md`.
base_dir: ".."
name: machinum-4b-v2-tuned

model:
  id: Qwen/Qwen3.5-4B
  revision: null
  load_in_4bit: false
  dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  modules_to_save:
    - lm_head
  use_rslora: false

train:
  max_seq_length: 4096
  per_device_batch: 1
  grad_accum: 16
  lr: 1.0e-4
  epochs: 3.0
  warmup_steps: 8
  weight_decay: 0.05
  max_grad_norm: 1.0
  scheduler: cosine
  optim: adamw_8bit
  seed: 42
  packing: false
  completion_only_loss: true
  save_steps: 20
  eval_steps: 20

data:
  input: data/v2
  val_ratio: 0.1
  dedupe: true
  min_chars: 50
  max_chars: 8000
  max_tokens: null

quantize:
  method: q4_k_s
  imatrix: false
  output: out/model-machinum-4b-v2-tuned.gguf

output_dir: out
