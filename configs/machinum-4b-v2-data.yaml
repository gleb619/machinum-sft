# machinum:4b v2, data arm — the same LoRA recipe on a bigger, multi-line corpus.
#
# `docs/score-improvement.md` explains the change: 49 single-line pairs over 2 epochs is four
# optimiser steps, and the model had never seen a line break in its input, so a multi-line prompt
# could only be answered by collapsing it (arena: line_parity 2/6). This config keeps every
# hyperparameter of `qwen3.5-4b-lora.yaml` and changes only the data and the number of epochs.
base_dir: ".."
name: machinum-4b-v2-data

model:
  id: Qwen/Qwen3.5-4B
  revision: null
  load_in_4bit: false
  dtype: bfloat16

lora:
  r: 32
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  modules_to_save:
    - lm_head
  use_rslora: false

train:
  max_seq_length: 4096
  per_device_batch: 1
  grad_accum: 16
  lr: 5.0e-5
  epochs: 3.0
  warmup_steps: 8
  weight_decay: 0.05
  max_grad_norm: 1.0
  scheduler: cosine
  optim: adamw_8bit
  seed: 42
  packing: false
  completion_only_loss: true
  save_steps: 20
  eval_steps: 20

data:
  input: data/v2
  val_ratio: 0.1
  dedupe: true
  min_chars: 50
  max_chars: 8000
  max_tokens: null

quantize:
  method: q4_k_s
  imatrix: false
  output: out/model-machinum-4b-v2-data.gguf

output_dir: out
