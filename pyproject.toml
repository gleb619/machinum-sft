[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machinum-sft"
version = "0.1.0"
description = "Fine-tuning CLI for the machinum-pipeline book/translation model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "machinum" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
train = [
  "torch>=2.5",
  "transformers>=4.46",
  "trl>=0.12",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
  "bitsandbytes>=0.44",
]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
msft = "msft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
